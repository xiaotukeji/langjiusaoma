{extend name="index_layout"/}
{block name="main"}
<form class="layui-form" method="post">
    {:token()}
    <div class="layui-form-item">
        <label class="layui-form-label">数据标题</label>
        <div class="layui-input-block">
            <input type="text" name="title" lay-verify="required" autocomplete="off" placeholder="数据标题" class="layui-input">
        </div>
    </div>
<!--    <div class="layui-form-item">
        <label class="layui-form-label">下载地址</label>
        <div class="layui-input-block">
            <input  name="link" lay-verify="required" autocomplete="off" placeholder="下载地址" class="layui-input">
        </div>
    </div>-->

    <div class="layui-form-item">
        <label class="layui-form-label">数据上传</label>
        <div class="layui-input-block">
            <div class="layui-col-xs4">
                <input type="text" name="link"  id="c-link" value="" class="layui-input">
            </div>
            <button type="button" class="layui-btn faupload" id="faupload-link" data-multiple="true" data-input-id="c-link" data-preview-id="p-link" data-type="file">
                <i class="layui-icon layui-icon-upload"></i> 上传</button>
<!--            <button type="button" class="layui-btn fachoose" data-multiple="false" data-mimetype="file" data-input-id="c-link" id="fachoose-c-link">
                <i class="iconfont icon-other"></i> 选择</button>-->
        </div>
        <div class="layui-form-mid2 layui-word-aux">文件路径</div>
    </div>



    <div class="layui-form-item">
        <label class="layui-form-label">更新时间</label>
        <div class="layui-input-block">
            <input  name="data_time" lay-verify="required" autocomplete="off" placeholder="更新时间" class="layui-input">
        </div>
    </div>



    <div class="layui-form-item layer-footer">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit="">立即提交</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </div>
</form>
{/block}
{block name="script"}
<script type="text/javascript">
layui.use('yznForm', function() {
    var yznForm = layui.yznForm;
    yznForm.bindevent($("form.layui-form"));
});
</script>
{/block}
