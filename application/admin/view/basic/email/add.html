{extend name="index_layout"/}
{block name="main"}
<form class="layui-form" method="post">
    {:token()}
    <div class="layui-form-item">
        <label class="layui-form-label">发件人</label>
        <div class="layui-input-block">
            <input type="text" name="sender" lay-verify="required" autocomplete="off" placeholder="发件人" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">发件邮箱</label>
        <div class="layui-input-block">
            <input  name="send_email" lay-verify="required" autocomplete="off" placeholder="发件邮箱" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">邮件标题</label>
        <div class="layui-input-block">
            <input  name="title" lay-verify="required" autocomplete="off" placeholder="邮件标题" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">发件时间</label>
        <div class="layui-input-block">
            <input type="text" name="receive_time" lay-verify="required" autocomplete="off" placeholder="发件时间" class="layui-input">
        </div>
    </div>


    <div class="layui-form-item layer-footer">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit="">立即提交</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </div>
</form>
{/block}
{block name="script"}
<script type="text/javascript">
layui.use('yznForm', function() {
    var yznForm = layui.yznForm;
    yznForm.bindevent($("form.layui-form"));
});
</script>
{/block}
