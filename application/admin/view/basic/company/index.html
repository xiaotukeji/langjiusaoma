{extend name="index_layout"/}
{block name="main"}
<div class="layui-card">
    <div class="layui-card-header">产品列表</div>
    <div class="layui-card-body">
        <div class="layui-form">
            <table class="layui-hide" id="currentTable" lay-filter="currentTable"></table>
        </div>
    </div>
</div>
{/block}
{block name="script"}
<!-- 引入JSZip库用于压缩文件 -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="text/javascript">
    layui.use(['yznTable', 'jquery', 'layer'], function() {
        var table = layui.yznTable;
        var $ = layui.jquery;
        var layer = layui.layer;

        var init = {
            table_elem: '#currentTable',
            table_render_id: 'currentTable',
            add_url: '{:url("add")}',
            edit_url: '{:url("edit")}',
            delete_url: '{:url("del")}',
            modify_url:'{:url("multi")}',
            empty_url: '{:url("addEmpty")}',
            copy_url: '{:url("copy")}',
        };

        // 定义一个函数来添加"插入空记录"按钮和"下载二维码"按钮
        function addEmptyRecordButton() {
            // 等待一小段时间确保工具栏已经渲染
            setTimeout(function() {
                // 检查按钮是否已存在，如果不存在才添加
                if ($('.empty-record-btn').length === 0) {
                    // 找到删除按钮
                    var $deleteBtn = $('.layui-table-tool .layui-btn-danger');

                    // 添加一个插入空记录按钮
                    var $btn = $('<button class="layui-btn layui-btn-warm layui-btn-sm empty-record-btn" style="margin-left:5px;"><i class="layui-icon layui-icon-add-circle"></i>插入空记录</button>');

                    // 在删除按钮后面添加
                    $deleteBtn.after($btn);

                    // 绑定点击事件
                    $btn.on('click', function() {
                        $.post(init.empty_url, {}, function(res) {
                            // 显示成功提示
                            layer.msg('添加成功', {icon: 1});

                            // 手动触发表格重载
                            layui.table.reload('currentTable');

                            // 确保按钮会被重新添加
                            addEmptyRecordButton();
                        });
                    });
                }
                
                // 检查下载二维码按钮是否已存在
                if ($('.batch-download-qrcode-btn').length === 0) {
                    // 找到插入空记录按钮
                    var $emptyBtn = $('.empty-record-btn');
                    
                    // 添加一个批量下载二维码按钮
                    var $downloadBtn = $('<button class="layui-btn layui-btn-normal layui-btn-sm batch-download-qrcode-btn" style="margin-left:5px;"><i class="layui-icon layui-icon-download-circle"></i>下载二维码</button>');
                    
                    // 在插入空记录按钮后面添加
                    $emptyBtn.after($downloadBtn);
                    
                    // 绑定点击事件
                    $downloadBtn.on('click', function() {
                        showBatchDownloadDialog();
                    });
                }
            }, 100);
        }
        
        // 显示批量下载对话框
        function showBatchDownloadDialog() {
            var contentHtml = '<div style="padding:20px;">' +
                            '<div class="layui-form-item">' +
                            '<label class="layui-form-label">起始编号</label>' +
                            '<div class="layui-input-block">' +
                            '<input type="number" id="startId" value="0" placeholder="请输入起始产品ID（0表示全部）" class="layui-input" min="0" step="1" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')">' +
                            '</div>' +
                            '</div>' +
                            '<div class="layui-form-item">' +
                            '<label class="layui-form-label">结束编号</label>' +
                            '<div class="layui-input-block">' +
                            '<input type="number" id="endId" value="0" placeholder="请输入结束产品ID（0表示全部）" class="layui-input" min="0" step="1" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')">' +
                            '</div>' +
                            '</div>' +
                            '<div class="layui-form-item">' +
                            '<div class="layui-input-block">' +
                            '<p style="color:#999; font-size:12px;">提示：两个编号都为0时下载全部产品二维码；只能输入正整数</p>' +
                            '</div>' +
                            '</div>' +
                            '</div>';
            
            layer.open({
                type: 1,
                title: '批量下载二维码',
                area: ['450px', '320px'],
                content: contentHtml,
                btn: ['开始下载', '取消'],
                yes: function(index) {
                    var startId = parseInt($('#startId').val()) || 0;
                    var endId = parseInt($('#endId').val()) || 0;
                    
                    // 验证输入：确保是正整数或0
                    if (isNaN(startId) || startId < 0 || startId % 1 !== 0) {
                        layer.msg('起始编号必须是0或正整数', {icon: 2});
                        return;
                    }
                    
                    if (isNaN(endId) || endId < 0 || endId % 1 !== 0) {
                        layer.msg('结束编号必须是0或正整数', {icon: 2});
                        return;
                    }
                    
                    // 验证逻辑：如果两个都大于0，起始编号不能大于结束编号
                    if (startId > 0 && endId > 0 && startId > endId) {
                        layer.msg('起始编号不能大于结束编号', {icon: 2});
                        return;
                    }
                    
                    // 开始批量下载
                    batchDownloadQrcodes(startId, endId);
                    layer.close(index);
                },
                btn2: function(index) {
                    layer.close(index);
                }
            });
        }
        
        // 批量下载二维码
        function batchDownloadQrcodes(startId, endId) {
            // 获取所有表格数据
            var allData = layui.table.cache[init.table_render_id];
            if (!allData || allData.length === 0) {
                layer.msg('没有可下载的数据', {icon: 2});
                return;
            }
            
            // 筛选需要下载的产品
            var downloadList = [];
            if (startId === 0 && endId === 0) {
                // 下载全部
                downloadList = allData.filter(function(item) {
                    return item.id && item.id > 0;
                });
            } else {
                // 根据ID范围筛选（包含起始和结束编号）
                downloadList = allData.filter(function(item) {
                    var id = parseInt(item.id);
                    if (!id || id <= 0) {
                        return false; // 排除无效ID
                    }
                    if (startId === 0 && endId > 0) {
                        // 只设置结束编号：下载ID <= endId的所有产品
                        return id <= endId;
                    } else if (startId > 0 && endId === 0) {
                        // 只设置起始编号：下载ID >= startId的所有产品
                        return id >= startId;
                    } else if (startId > 0 && endId > 0) {
                        // 两个都设置：下载ID在[startId, endId]范围内的产品（包含边界）
                        return id >= startId && id <= endId;
                    }
                    return false;
                });
            }
            
            if (downloadList.length === 0) {
                layer.msg('没有找到符合条件的产品', {icon: 2});
                return;
            }
            
            // 检查JSZip是否加载
            if (typeof JSZip === 'undefined') {
                layer.msg('JSZip库未加载，请刷新页面重试', {icon: 2});
                return;
            }
            
            // 显示下载提示（只显示一次，不频繁更新）
            var total = downloadList.length;
            var loadingIndex = layer.msg('下载中，请稍候...', {icon: 16, time: 0});
            
            // 创建ZIP对象
            var zip = new JSZip();
            var failedCount = 0;
            var hasShownProgress = false;
            
            // 使用Promise.all并行获取所有二维码
            var promises = downloadList.map(function(item, index) {
                var qrcodeUrl = '{:url("qrcode")}?id=' + item.id;
                var filename = 'product_' + item.id + '.png';
                
                return fetch(qrcodeUrl)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('获取失败: ' + item.id);
                        }
                        return response.blob();
                    })
                    .then(function(blob) {
                        // 添加到ZIP
                        zip.file(filename, blob);
                        
                        // 只在第一个或第二个完成时更新一次提示，之后不再更新
                        if (!hasShownProgress && (index === 0 || index === 1)) {
                            layer.msg('下载中，请稍候...', {icon: 16, time: 0});
                            hasShownProgress = true;
                        }
                        
                        return {success: true, id: item.id};
                    })
                    .catch(function(error) {
                        console.error('获取二维码失败:', item.id, error);
                        failedCount++;
                        return {success: false, id: item.id, error: error.message};
                    });
            });
            
            // 等待所有请求完成
            Promise.all(promises).then(function(results) {
                // 生成ZIP文件
                zip.generateAsync({type: 'blob'})
                    .then(function(content) {
                        // 下载ZIP文件
                        var zipFilename = 'qrcodes_' + (startId === 0 && endId === 0 ? 'all' : startId + '_' + endId) + '_' + new Date().getTime() + '.zip';
                        var a = document.createElement('a');
                        var url = window.URL.createObjectURL(content);
                        a.href = url;
                        a.download = zipFilename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        layer.close(loadingIndex);
                        var successCount = total - failedCount;
                        if (failedCount > 0) {
                            layer.msg('压缩完成！成功: ' + successCount + ' 个，失败: ' + failedCount + ' 个', {icon: failedCount === total ? 2 : 0, time: 3000});
                        } else {
                            layer.msg('压缩完成！共 ' + successCount + ' 个二维码已打包下载', {icon: 1, time: 3000});
                        }
                    })
                    .catch(function(error) {
                        layer.close(loadingIndex);
                        layer.msg('生成ZIP文件失败: ' + error.message, {icon: 2});
                        console.error('ZIP生成失败:', error);
                    });
            })
            .catch(function(error) {
                layer.close(loadingIndex);
                layer.msg('下载失败: ' + error.message, {icon: 2});
                console.error('批量下载失败:', error);
            });
        }

        table.render({
            init: init,
            toolbar: ['refresh', 'add', 'delete'],
            defaultToolbar:[],
            url: '{:url("index")}',
            cols: [
                [
                    { type: 'checkbox', fixed: 'left' },
                    { field: 'id', width: 80, title: 'ID'},
                    { field: 'query_times', width: 100,title: '扫码次数', edit: 'text' },
                    { field: 'name', width: 200, title: '产品名称', searchOp: 'like',edit: 'text' },
                    // { field: 'shengchanpihao', width: 120,title: '生产批号', searchOp: 'like',edit: 'text' },
                    // { field: 'produce_time',width: 120, title: '生产日期', edit: 'text' },
                    // { field: 'jiujingdu', width: 100,title: '酒精度', edit: 'text' },
                    // { field: 'rongliang', width: 100,title: '容量', edit: 'text' },
                    // {
                    //     field: 'wuliuma',
                    //     width: 150,
                    //     title: '物流码（前12）',
                    //     searchOp: 'like',
                    //     edit: 'text',
                    //     templet: function(d) {
                    //         return (d.wuliuma || '').slice(0, 12);
                    //     }
                    // },
                    // {
                    //     field: 'wuliuma2',
                    //     width: 150,
                    //     title: '物流码（后12）',
                    //     searchOp: 'like',
                    //     edit: 'text',
                    //     templet: function(d) {
                    //         return (d.wuliuma2 || '').slice(0, 12);
                    //     }
                    // },
                    { field: 'keys', width: 240,title: '查询码' },
                    // { field: 'cover', width: 100, title: '封面图', templet: function(d){
                    //         if(d.cover && d.cover.length > 0){
                    //             return '<img src="' + d.cover + '" style="max-width:100px; max-height:60px; cursor:pointer;" onclick="layer.photos({photos: {title: \'查看图片\', data: [{src: \'' + d.cover + '\'}]}, anim: 5});">';
                    //         }else{
                    //             return '';
                    //         }
                    //     }},
                    // { field: 'showWuliu', title: '物流显示', width: 100, unresize: true,templet: yznTable.formatter.switch,tips:"显示|隐藏"},
                    { field: 'status', title: '状态', width: 100, unresize: true,templet: yznTable.formatter.switch,tips:"开|禁"},
                    { width:400, title: '操作',templet: function (d){
                            return yznTable.formatter.tool.call(this,d,this);
                        },operat: [
                            [{
                                text: "<i class='iconfont icon-copy'>复制产品</i>",
                                title: '复制',
                                url: init.copy_url,
                                class: 'layui-btn layui-btn-xs layui-btn-normal layui-tr-copy',
                                method: 'href',
                                field: 'id',
                                extend: ""
                            }, {
                                text: "<i class='iconfont icon-link'>复制链接</i>",
                                title: '复制链接',
                                class: 'layui-btn layui-btn-xs layui-btn-primary copy-link-btn',
                                method: 'none',
                                extend: 'data-key="{{d.keys}}"',
                                field: 'keys'
                            }, {
                                text: "<i class='layui-icon layui-icon-qrcode'>二维码</i>",
                                title: '生成二维码',
                                class: 'layui-btn layui-btn-xs layui-btn-warm show-qrcode-btn',
                                method: 'none',
                                extend: 'data-id="{{d.id}}"',
                                field: 'id'
                            }],
                            'edit', 'delete'
                        ]}
                ]
            ],
            page: {},
            done: function() {
                // 表格渲染完成后，添加按钮
                addEmptyRecordButton();
            }
        });

        // 监听表格工具栏事件
        layui.table.on('toolbar(currentTable)', function(obj){
            // 每次工具栏有动作时，确保我们的按钮存在
            setTimeout(function(){
                addEmptyRecordButton();
            }, 100);
        });

        // 监听单元格编辑事件，用于处理物流码长度限制
        layui.table.on('edit(currentTable)', function(obj){
            var value = obj.value;
            var field = obj.field;

            // 如果是物流码字段，限制为12个字符
            if(field === 'wuliuma' || field === 'wuliuma2') {
                if(value.length > 12) {
                    value = value.slice(0, 12);
                    // 更新表格数据
                    var updateData = {};
                    updateData[field] = value;
                    obj.update(updateData);
                    // 提示用户
                    layer.msg(field === 'wuliuma' ? '物流码（前12）已限制为12个字符' : '物流码（后12）已限制为12个字符', {icon: 0});
                }

                // 将修改后的数据提交到服务器
                var postData = {
                    id: obj.data.id,
                    param: field,
                    value: value
                };

                $.post(init.modify_url, postData, function(res) {
                    if (res.code == 1) {
                        layer.msg('更新成功', {icon: 1});
                    } else {
                        layer.msg(res.msg || '更新失败', {icon: 2});
                        // 如果失败，重新加载表格
                        layui.table.reload('currentTable');
                    }
                });
            }
        });

        // 初始添加按钮
        addEmptyRecordButton();

        yznTable.listenSwitch({filter: 'status', url: init.modify_url});
        yznTable.bindevent();

        // 监听复制按钮点击事件
        $(document).on('click', '.layui-tr-copy', function() {
            var that = $(this),
                tableId = $(this).data('table'),
                href = !that.attr('data-href') ? that.attr('href') : that.attr('data-href');
            tableId = tableId || init.table_render_id;
            layer.confirm('您确定要复制产品吗？', { icon: 3, title: '提示信息' }, function(index) {
                if (!href) {
                    layer.msg('请设置href参数');
                    return false;
                }
                $.post(href, function(res) {
                    if (res.code == 1) {
                        layer.msg(res.msg, {icon: 1});
                        tableId && layui.table.reload(tableId);
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                });
                layer.close(index);
            });
            return false;
        });

        // 监听复制链接按钮点击事件
        $(document).on('click', '.copy-link-btn', function() {
            var that = $(this);
            // 获取当前行数据
            var tr = that.closest('tr');
            var data = layui.table.cache[init.table_render_id][tr.data('index')];
            var keys = data.keys;
            var id = data.id; // 获取产品ID

            // 获取配置的链接基础URL（从PHP传递过来的rukou_url配置）
            var linkBaseUrl = '{$linkBaseUrl}';
            // 如果没有配置，使用当前域名
            if (!linkBaseUrl || linkBaseUrl === '') {
                linkBaseUrl = window.location.origin;
            }
            // 确保URL格式正确（去除末尾的斜杠）
            linkBaseUrl = linkBaseUrl.replace(/\/+$/, '');

            // 构建完整链接，自动添加唯一的 nocache 参数避免浏览器历史记录规范化 URL 大小写
            // 使用时间戳+产品ID（纯数字）确保每个链接的唯一性
            var timestamp = Date.now();
            var fullLink = linkBaseUrl + '/index?key=' + encodeURIComponent(keys) + '&nocache=' + timestamp + id;

            // 复制到剪贴板
            var tempInput = document.createElement('input');
            tempInput.style.position = 'absolute';
            tempInput.style.left = '-1000px';
            tempInput.value = fullLink;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            // 显示成功消息
            layer.msg('链接复制成功', {icon: 1});

            return false;
        });

        // 监听二维码按钮点击事件
        $(document).on('click', '.show-qrcode-btn', function() {
            var that = $(this);
            // 从表格数据中获取产品ID，更可靠
            var tr = that.closest('tr');
            var data = layui.table.cache[init.table_render_id][tr.data('index')];
            var id = data.id;
            
            if (!id) {
                // 如果从表格数据获取不到，尝试从data属性获取
                id = that.data('id');
            }
            
            if (!id) {
                layer.msg('产品ID不能为空', {icon: 2});
                return false;
            }
            
            // 构建二维码图片URL（使用相对路径，与其他操作保持一致）
            var qrcodeUrl = '{:url("qrcode")}?id=' + id;
            
            // 使用layer弹窗显示二维码
            var contentHtml = '<div style="text-align:center; padding:20px;">' +
                             '<img src="' + qrcodeUrl + '" style="max-width:100%; border:1px solid #ddd;" alt="二维码" onerror="this.onerror=null; this.src=\'\'; this.parentElement.innerHTML=\'<p style=\\\'color:red;\\\'>二维码加载失败，请检查权限或刷新重试</p>\';">' +
                             '<div style="margin-top:15px;">' +
                             '<button class="layui-btn layui-btn-sm" id="downloadQrBtn_' + id + '">下载二维码</button>' +
                             '</div>' +
                             '</div>';
            
            var layerIndex = layer.open({
                type: 1,
                title: '产品二维码 - ID: ' + id,
                area: ['450px', '550px'],
                content: contentHtml,
                btn: ['关闭'],
                yes: function(index) {
                    layer.close(index);
                },
                success: function(layero, index) {
                    // 绑定下载按钮事件
                    $('#downloadQrBtn_' + id).on('click', function() {
                        downloadQrcode(qrcodeUrl, 'product_' + id + '.png');
                    });
                }
            });
            
            return false;
        });
        
        // 下载二维码函数
        function downloadQrcode(url, filename) {
            // 使用fetch下载，避免跨域问题
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('下载失败');
                    }
                    return response.blob();
                })
                .then(blob => {
                    var a = document.createElement('a');
                    var url = window.URL.createObjectURL(blob);
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    layer.msg('下载成功', {icon: 1});
                })
                .catch(error => {
                    layer.msg('下载失败：' + error.message, {icon: 2});
                });
        }
    });
</script>
{/block}
