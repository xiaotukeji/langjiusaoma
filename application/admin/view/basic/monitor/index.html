{extend name="index_layout"/}
{block name="main"}
<div class="layui-card">
    <div class="layui-card-header">产品列表</div>
    <div class="layui-card-body">
        <div class="layui-form">
            <table class="layui-hide" id="currentTable" lay-filter="currentTable"
></table>
        </div>
    </div>
</div>
{/block}
{block name="script"}
<script type="text/javascript">
layui.use('yznTable', function() {
    var table = layui.yznTable;

    var init = {
        table_elem: '#currentTable',
        table_render_id: 'currentTable',
        add_url: '{:url("add")}',
        edit_url: '{:url("edit")}',
        delete_url: '{:url("del")}',
    };

    table.render({
        init: init,
        toolbar: ['refresh','add'],
        url: '{:url("index")}',
        cols: [
            [
                { field: 'id', width: 80, title: 'ID'},
                { field: 'name', width: 130, title: '企业名称', searchOp: 'like' },


                { field: 'mobile', width: 130, title: '电话', searchOp: 'like'  },
                { field: 'officer_name',width: 200, title: '督导姓名', searchOp: 'like'  },
                { field: 'color_level', width: 150,title: '预警级别', searchOp: 'like'  },
                { field: 'warning_times', width: 90,title: '预警次数', searchOp: 'like'  },
                { field: 'address', width: 400, title: '地址', searchOp: 'like'  },
                { width:100, title: '操作',templet: function (d){

                        return yznTable.formatter.tool.call(this,d,this);

                },operat: ['delete']}
            ]
        ],
        page: {}
    });

    yznTable.bindevent();
});
</script>
{/block}
