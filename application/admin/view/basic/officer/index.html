{extend name="index_layout"/}
{block name="main"}
<div class="layui-card">
    <div class="layui-card-header">督导人员</div>
    <div class="layui-card-body">
        <div class="layui-form">
            <table class="layui-hide" id="currentTable" lay-filter="currentTable"
></table>
        </div>
    </div>
</div>
{/block}
{block name="script"}
<script type="text/javascript">
layui.use('yznTable', function() {
    var table = layui.yznTable;

    var init = {
        table_elem: '#currentTable',
        table_render_id: 'currentTable',
        add_url: '{:url("add")}',
        edit_url: '{:url("edit")}',
        delete_url: '{:url("del")}',
    };

    table.render({
        init: init,
        toolbar: ['refresh','add'],
        url: '{:url("index")}',
        cols: [
            [
                { field: 'id', width: 80, title: 'ID'},
                { field: 'gonghao', width: 80, title: '工号', searchOp: 'like' },
                { field: 'realname', width: 80, title: '姓名', searchOp: 'like'},
                { field: 'mobile', width: 150,title: '手机', searchOp: 'like'  },
                { field: 'wechat', width: 150, title: '微信', searchOp: 'like' },
                { field: 'company_str', width: 900, title: '帮扶企业', searchOp: 'like' },

                { width:100, title: '操作',templet: function (d){

                        return yznTable.formatter.tool.call(this,d,this);

                },operat: ['delete']}
            ]
        ],
        page: {}
    });

    yznTable.bindevent();
});
</script>
{/block}
