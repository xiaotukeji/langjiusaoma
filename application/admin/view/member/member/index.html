{extend name="admin@index_layout"/}
{block name="main"}
<div class="layui-card">
    <div class="layui-card-header">会员列表</div>
    <div class="layui-card-body">
        <table class="layui-hide" id="currentTable" lay-filter="currentTable" 
            data-auth-add="{:$auth->check('member.member/add')}"
            data-auth-edit="{:$auth->check('member.member/edit')}"
            data-auth-delete="{:$auth->check('member.member/del')}"
        ></table>
    </div>
</div>
{/block}
{block name="script"}
<script>
layui.use('yznTable', function() {
    var table = layui.yznTable;

    var init = {
        table_elem: '#currentTable',
        table_render_id: 'currentTable',
        add_url: "{:url('add')}",
        edit_url: "{:url('edit')}",
        delete_url: "{:url('del')}",
    };

    table.render({
        init: init,
        toolbar: ['refresh',  'delete'],
        url: '{:url("index")}',
        cols: [
            [
                { type: 'checkbox', fixed: 'left' },
                { field: 'id', width: 90, title: '用户ID' },
                { field: 'group.name', width: 110, title: '用户组'},
                { field: 'username', width: 100, title: '用户名',templet: '<div>{{#  if(d.vip==1){ }} <span class="text-danger">[VIP]</span> {{#  } }}{{ d.username }}</div>', searchOp: 'like'},
                { field: 'country_tel', width: 100, title: '国家', searchOp: 'like' },
                { field: 'mobile', width: 100, title: '手机', searchOp: 'like' },
                { field: 'email',  title: '邮箱', searchOp: 'like' },
                { field: 'avatar',  title: 'logo', templet: '<a href="{{ d.avatar }}" target="_blank"><img src="{{ d.avatar }}"></a>' },
                { field: 'licence',  title: 'licence', templet: '<a href="{{ d.License }}" target="_blank">下载</a>\' ' },
                { field: 'company_name', title: '公司名称' },
                { field: 'company_web', title: '公司网站' },
                { field: 'company_web', title: '公司服务' },
                { field: 'country1', title: 'country1' },
                { field: 'address1', title: '地址1' },
                { field: 'country2', title: 'country2' },
                { field: 'address2', title: '地址2' },
                { field: 'CompanyProfile', title: 'CompanyProfile' },
                { field: 'License', title: 'License' },

                { field: 'JobTitle', title: 'JobTitle' },
                { field: 'Fax', title: 'Fax' },
                { field: 'Skype', title: 'Skype' },
                { field: 'wechat', title: 'wechat' },
                { field: 'Whatsapp', title: 'Whatsapp' },



                /*{ field: 'last_login_time', title: '最后登录', search: 'range',templet: yznTable.formatter.datetime },*/
                { field: 'amount', width: 90, title: '余额' },
/*                { field: 'point', width: 90, title: '积分总数' },
                { field: 'login', width: 90, title: '登录次数' },*/
                { width:90, title: '操作',templet: yznTable.formatter.tool,operat: ['edit','delete']}
            ]
        ],
        page: {}
    });

    yznTable.bindevent();
});
</script>
{/block}
