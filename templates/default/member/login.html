<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Register Now</title>
    <link rel="stylesheet" type="text/css" href="__STATIC__/libs/layui/css/layui.css" />
    <link rel="stylesheet" type="text/css" href="__STATIC__/addons/member/css/style.css" />
    <link rel="stylesheet" href="__ADDONS__/member/css/global.css">
    <link rel="stylesheet" href="__STATIC__/common/font/iconfont.css">

    <script src="__STATIC__/libs/layui/layui.js"></script>
    <script src="__STATIC__/libs/jquery/jquery.min.js"></script>





</head>

<body class="body light-theme">

<div class="fly-header">
    <div class="layui-container">
        <a class="fly-logo" href="{:url('/')}">
            <img src="/static/image/logo.png" alt="layui" width="90">
        </a>
        <ul class="layui-nav fly-nav layui-hide-xs">
            <li class="layui-nav-item layui-this">
                <a href="{:url('/')}">HOME</a>
            </li>
        </ul>

    </div>
</div>
    <div id="mydiv">
        <div class="login-main">
            <div class="layui-elip">Sign In</div>
            <form class="layui-form" action="{:url('login')}">
                <!--@MemberRegisterFormBegin-->
                <input type="hidden" name="forward" value="{$forward}" />
                {:token()}
                <div class="layui-form-item">
                    <div class="layui-input-wrap">
                        <div class="layui-input-prefix">
                            <label class="layui-icon layui-icon-username"></label>
                        </div>
                        <input type="text" name="account" lay-verify="required" autocomplete="off" placeholder="Email" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-wrap">
                        <div class="layui-input-prefix">
                            <label class="layui-icon layui-icon-password"></label>
                        </div>
                        <input type="password" name="password" lay-verify="required" autocomplete="off" placeholder="Password" class="layui-input" lay-affix="eye">
                    </div>
                </div>
                <!--@CaptchaBegin-->
                {eq name="Member_config.openverification" value="1"}
<!--                <div class="layui-form-item">
                    <div class="layui-input-wrap verify-box">
                        <div class="layui-input-prefix">
                            <label class="layui-icon layui-icon-vercode"></label>
                        </div>
                        <input type="text" name="verify" lay-verify="required" placeholder="验证码" autocomplete="off" class="layui-input">
                        <img id="verify" src="{:captcha_src()}" alt="验证码" class="captcha">
                    </div>
                </div>-->
                {/eq}
                <!--@CaptchaEnd-->
                <div class="layui-form-item">
                    <input type="checkbox" name="keeplogin" lay-skin="primary" title="Remember Me" value="1" checked>
                    <a href="{:url('forget')}" class="lay-user-jump-change lay-link" style="margin-top: 7px;">Forget Password？</a>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-inline login-btn">
                        <button class="layui-btn" lay-submit>Sign In</button>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-trans layui-form-item lay-user-login-other">
                        {:hook('sync_login')}
                        <a href="{:url('register')}" class="lay-user-jump-change lay-link">Don't you have an account? Register</a>
                    </div>
                </div>
                <!--@MemberRegisterFormEnd-->
            </form>
        </div>
    </div>
    {include file="layui" /}
    <script type="text/javascript">
    layui.use(['form', 'layer','yznForm'], function() {
        var form = layui.form,
            layer = layui.layer,
            yznForm = layui.yznForm;

            yznForm.bindevent($("form.layui-form"),'', function (data,res) {
                layer.msg(res.msg, {
                    offset: '15px',
                    icon: 1,
                    time: 1000
                }, function() {
                    window.location.href = res.url;
                });
                return false;
            }, function (res) {
                //刷新验证码
                $("#verify").click();
                //layer.msg(res.msg, { icon: 5 });
            });
    });
    //刷新验证码
    $("#verify").click(function() {
        var verifyimg = $("#verify").attr("src");
        $("#verify").attr("src", verifyimg.replace(/\?.*$/, '') + '?' + Math.random());
    });
    </script>
</body>

</html>
