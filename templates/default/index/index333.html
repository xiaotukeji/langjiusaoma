<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Select with Images</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.1/css/bootstrap-select.min.css" rel="stylesheet">
  <style>
    .selectpicker .dropdown-menu .inner li img {
      width: 20px; /* Adjust image size as needed */
      height: 20px; /* Adjust image size as needed */
      margin-right: 5px; /* Adjust spacing between image and text */
    }
  </style>
</head>
<body>
  
  <select class="selectpicker" data-live-search="true">
    <option data-content="<img src='path/to/image1.jpg'> Option 1">Option 1</option>
    <option data-content="<img src='path/to/image2.jpg'> Option 2">Option 2</option>
    <!-- Add more options as needed -->
  </select>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.1/js/bootstrap-select.min.js"></script>
  <script>
    $(document).ready(function () {
      $('.selectpicker').selectpicker();
    });
  </script>
</body>
</html>
